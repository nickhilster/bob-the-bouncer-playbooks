id: "cra-vishing"
country: "CA"
country_name: "Canada"
name: "CRA impersonation call"
status: "verified"
channels:
  - "phone"
  - "voicemail"
hook: "A caller claims to be from the CRA and pressures you to settle a tax debt immediately."
script:
  - "The caller claims you owe taxes and threatens arrest unless you pay now."
  - "They try to keep you on the call or direct you to a callback number they supply."
kill_shot: "End the call. Check directly with the CRA before sharing information or paying."
kill_shot_local:
  fr: "Raccrochez. Vérifiez directement auprès de l’ARC avant de donner des renseignements ou de payer."
safe_path:
  - "Do not share personal details or pay during the call. End it."
  - "Check your CRA account or look up the CRA’s official contact details yourself. Do not rely on caller ID, the caller’s number or whether you remember getting a letter."
  - "If you sent money or gave payment details, contact your financial institution right away using a number you already trust."
  - "Report the attempt to the Canadian Anti-Fraud Centre. If fraud occurred, also contact your local police."
helplines:
  - {"name":"CRA: verify contact","number":"1-800-959-8281","url":"https://www.canada.ca/en/revenue-agency/corporate/scams-fraud/verify-cra-contact.html"}
  - {"name":"Canadian Anti-Fraud Centre","number":"1-888-495-8501","url":"https://antifraudcentre-centreantifraude.ca/report-signalez-eng.htm"}
sources:
  - "https://www.canada.ca/en/revenue-agency/corporate/scams-fraud/recognize-scam.html"
  - "https://www.canada.ca/en/revenue-agency/corporate/scams-fraud/verify-cra-contact.html"
  - "https://www.canada.ca/en/revenue-agency/services/payments/payments-cra/confirm-payment.html"
  - "https://antifraudcentre-centreantifraude.ca/report-signalez-eng.htm"
  - "https://antifraudcentre-centreantifraude.ca/scams-fraudes/victim-victime-eng.htm"
notes: "Official guidance checked 2026-11-23. Fictional scenario summary; no real case details."
